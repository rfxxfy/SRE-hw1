global:
  resolve_timeout: 5m
route:
  receiver: taskboard-webhook
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
receivers:
  - name: taskboard-webhook
    webhook_configs:
      - url: http://taskboard-alert-receiver.monitoring.svc.cluster.local:8080/alerts
        send_resolved: true
