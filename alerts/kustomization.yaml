apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s.yaml
configMapGenerator:
  - name: taskboard-alert-rules
    files:
      - rules.yml
  - name: taskboard-alertmanager-config
    files:
      - alertmanager.yml
  - name: taskboard-alert-receiver
    files:
      - receiver.py
