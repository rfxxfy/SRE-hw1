<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Список задач</h1>
      <p>Добавляйте задачи и отмечайте выполненные.</p>
    </header>

    <form id="task-form">
      <h2 id="form-heading">Новая задача</h2>
      <label for="title">Название</label>
      <input id="title" name="title" maxlength="120" required autofocus>
      <label for="description">Описание</label>
      <textarea id="description" name="description" maxlength="1000" rows="3"></textarea>
      <div class="form-actions">
        <button type="submit" id="submit-button">Добавить</button>
        <button type="button" id="cancel-button" class="secondary" hidden>Отмена</button>
      </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Задачи</h2>
      <ul id="tasks"></ul>
    </section>
  </main>
</body>
</html>
